<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watcharr Scrobbler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon-48.png" alt="Logo" class="logo" />
      <div class="head-text">
        <h1>Watcharr Scrobbler</h1>
        <span id="connStatus" class="conn">…</span>
      </div>
    </header>

    <section id="nowPlaying" class="card hidden">
      <div class="np-head">
        <span id="nowPlayingLabel" class="label">Now on …</span>
        <span id="npType" class="chip">Movie</span>
      </div>
      <div id="npTitle" class="np-title">—</div>
      <div id="npEpisode" class="np-episode"></div>
      <div class="progress">
        <div id="npBar" class="progress-bar"></div>
      </div>
      <div class="np-meta">
        <span id="npProgress">0 %</span>
        <span id="npStatus" class="scrobble-status">—</span>
      </div>
    </section>

    <section
      id="noService"
      class="card muted hidden"
      data-i18n="popup.noService"
    >
      Open Netflix or Amazon Prime Video and start a movie or series – the popup
      will then show the progress.
    </section>

    <section id="notConfigured" class="card warn hidden">
      <strong data-i18n="popup.notConfigured">Not configured.</strong>
      <p data-i18n="popup.notConfiguredDetail">
        Connect your Watcharr instance in the settings.
      </p>
    </section>

    <div class="controls">
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
      <span id="enabledLabel" data-i18n="popup.scrobblingActive"
        >Scrobbling active</span
      >
      <span class="spacer"></span>
      <button id="optionsBtn" class="ghost" data-i18n="popup.openSettings">
        Settings
      </button>
    </div>

    <section class="sync">
      <button id="historyBtn" class="ghost block" data-i18n="popup.openHistory">
        History
      </button>
    </section>

    <footer id="foot">—</footer>

    <script src="../i18n/locale.js"></script>
    <script src="../i18n/index.js"></script>
    <script src="../background/services.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
